spring:
  application:
    name: code-quality-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codequality}
    username: ${DB_USERNAME:codequality}
    password: ${DB_PASSWORD:codequality}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

security:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-256-bits-long-value}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

github:
  api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
  token: ${GITHUB_TOKEN:}

ai:
  provider: ${AI_PROVIDER:openai}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4o-mini}
  azure-deployment: ${AI_AZURE_DEPLOYMENT:}
  azure-api-version: ${AI_AZURE_API_VERSION:2024-06-01}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
